; PlatformIO Project Configuration for ESP32-C3 Music Receiver
; Specially configured for ESP32-C3 SuperMini + UDA1334A DAC + SSD1306 0.42" OLED

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32 @ ^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Flash and memory tuning for ESP32-C3 4MB
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O2

lib_deps =
    olikraus/U8g2 @ ^2.35.19
